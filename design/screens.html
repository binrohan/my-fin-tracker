<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Fin Tracker Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column (max 1100px); wide bands for phone mockups and A4 report pages; ledger-green accent, paper stays white in both themes */
:root {
  --bg: #F4F7F5; --surface: #FFFFFF; --sunk: #E9EFEB; --fg: #14201A; --muted: #56665E; --line: #D5DED8;
  --accent: #0D6A55; --accent-soft: #D9EEE6; --on-accent: #FFFFFF;
  --good: #1D7A4B; --good-soft: #DCF0E3; --warn: #9C5A05; --warn-soft: #FAEACF; --bad: #B3322B; --bad-soft: #F7DDDA;
  --bezel: #1A2420; --scrim: rgba(10, 20, 16, .45);
  --paper: #FFFFFF; --paper-ink: #1A1F1C; --paper-muted: #66706B; --paper-line: #D9DFDB; --paper-accent: #0D6A55; --paper-soft: #EEF4F1; --paper-bad: #B3322B; --paper-good: #1D7A4B;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1311; --surface: #151D1A; --sunk: #1C2622; --fg: #E1EAE5; --muted: #93A39B; --line: #2A3631;
    --accent: #4EC2A0; --accent-soft: #173A30; --on-accent: #07231A;
    --good: #5BCB8A; --good-soft: #16321F; --warn: #E3A64C; --warn-soft: #382913; --bad: #EF7A70; --bad-soft: #3B1C19;
    --bezel: #000000; --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1311; --surface: #151D1A; --sunk: #1C2622; --fg: #E1EAE5; --muted: #93A39B; --line: #2A3631;
  --accent: #4EC2A0; --accent-soft: #173A30; --on-accent: #07231A;
  --good: #5BCB8A; --good-soft: #16321F; --warn: #E3A64C; --warn-soft: #382913; --bad: #EF7A70; --bad-soft: #3B1C19;
  --bezel: #000000; --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--f-body); padding-inline: 16px; padding-block: 0 64px; }
.wrap { max-width: 1100px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.15; margin: 0; }
h1 { font-size: clamp(2rem, 5vw, 3.1rem); font-weight: 700; letter-spacing: -.02em; }
h2 { font-size: 1.65rem; font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; max-width: 68ch; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--f-mono); font-size: .88em; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font: 500 .72rem/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lede { font-size: 1.08rem; color: var(--muted); max-width: 64ch; }

header.top { padding-block: 48px 28px; display: grid; gap: 16px; border-bottom: 1px solid var(--line); }
.meta { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: .88rem; }
.decisions { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 8px; }
.decision { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; }
.decision b { font-family: var(--f-display); font-size: 1.05rem; }
.decision span { color: var(--muted); font-size: .88rem; line-height: 1.45; }

nav.toc { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 16px; border-bottom: 1px solid var(--line); }
nav.toc a { text-decoration: none; color: var(--fg); background: var(--sunk); border-radius: 999px; padding: 4px 12px; font-size: .84rem; }
nav.toc a:hover { background: var(--accent-soft); color: var(--accent); }

section { padding-block: 48px 8px; display: grid; gap: 18px; }
section > header { display: grid; gap: 8px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.two > * { min-width: 0; }
.note { background: var(--accent-soft); border-radius: 10px; padding: 14px 16px; font-size: .92rem; max-width: 80ch; }
.note b { color: var(--accent); }
ul.tight { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
ul.tight li { max-width: 70ch; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 .72rem/1.3 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--sunk); }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.total td { font-weight: 600; background: var(--sunk); }
.matrix td.r { font-family: var(--f-mono); font-size: .86rem; }
.matrix td.hl { background: var(--accent-soft); }

/* posting example */
.postings { display: grid; gap: 10px; }
.posting { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.posting .t { font-weight: 600; }
.posting .legs { font-family: var(--f-mono); font-size: .8rem; display: grid; gap: 2px; color: var(--muted); }
.posting .legs .p { color: var(--good); } .posting .legs .m { color: var(--bad); }

/* features */
.features { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.feature { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 8px; align-content: start; }
.feature .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.feature .tag { font: 500 .68rem/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.feature .tag.p1 { background: var(--accent-soft); color: var(--accent); }
.feature p { font-size: .9rem; color: var(--muted); }
.feature ul { font-size: .88rem; }

/* phones */
.phones { display: grid; grid-template-columns: repeat(auto-fill, minmax(296px, 1fr)); gap: 28px 20px; justify-items: center; }
.phone { margin: 0; display: grid; gap: 10px; width: 296px; max-width: 100%; }
.phone figcaption { font-size: .84rem; color: var(--muted); line-height: 1.45; }
.phone figcaption b { color: var(--fg); font-family: var(--f-display); font-size: .98rem; display: block; }
.device { background: var(--bezel); border-radius: 38px; padding: 9px; }
.screen { background: var(--bg); border-radius: 30px; height: 610px; overflow: hidden; display: flex; flex-direction: column; font-size: 12px; line-height: 1.4; position: relative; }
.sb { display: flex; justify-content: space-between; padding: 10px 20px 4px; font: 500 10.5px/1 var(--f-mono); color: var(--muted); }
.ab { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 8px; gap: 8px; }
.ab .ttl { font: 700 17px/1.1 var(--f-display); }
.ab .sub { color: var(--muted); font-size: 10.5px; }
.body { flex: 1; overflow: hidden; padding: 0 12px 10px; display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 6px; }
.card.hero { background: var(--accent); color: var(--on-accent); border: 0; }
.card.hero .k { opacity: .85; }
.big { font: 700 28px/1.05 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.k { font: 500 9.5px/1.2 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.row > span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.sm { font-size: 11px; }
.row.sum { border-top: 1px solid var(--line); padding-top: 4px; font-weight: 600; }
.mut { color: var(--muted); }
.pos { color: var(--good); } .neg { color: var(--bad); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chip.out { border: 1px solid var(--line); color: var(--fg); font-weight: 500; }
.bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar i.w { background: var(--warn); } .bar i.b { background: var(--bad); } .bar i.g { background: var(--good); } .bar i.m { background: var(--muted); opacity: .45; }
.hero .bar { background: rgba(255,255,255,.25); } .hero .bar i { background: var(--on-accent); } .hero .bar i.m { background: var(--on-accent); opacity: .45; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tabbar { display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--line); background: var(--surface); padding: 6px 4px 12px; font-size: 9.5px; color: var(--muted); }
.tabbar span { display: grid; justify-items: center; gap: 2px; }
.tabbar span.on { color: var(--accent); font-weight: 600; }
.tabbar .ico { width: 18px; height: 18px; border-radius: 5px; border: 1.6px solid currentColor; }
.tabbar .fab { width: 44px; height: 44px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font: 400 26px/44px var(--f-body); text-align: center; margin-top: -18px; }
.list { display: grid; }
.list .row { padding: 6px 0; border-bottom: 1px solid var(--line); }
.list .row:last-child { border-bottom: 0; }
.cat { display: grid; gap: 4px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.cat:last-child { border-bottom: 0; }
.subs { display: grid; gap: 2px; padding-left: 10px; border-left: 2px solid var(--line); margin: 2px 0 0 2px; }
.btn { display: block; text-align: center; border-radius: 10px; padding: 8px; font-weight: 600; font-size: 11.5px; background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: var(--sunk); color: var(--fg); }
.btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.btns .btn { padding: 7px 4px; }

/* quick add sheet */
.dim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px 14px 14px; display: grid; gap: 9px; }
.grab { width: 36px; height: 4px; border-radius: 9px; background: var(--line); margin: 0 auto; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--sunk); border-radius: 9px; padding: 3px; font-size: 11px; text-align: center; }
.seg span { padding: 5px; border-radius: 7px; }
.seg span.on { background: var(--surface); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.amount { font: 700 34px/1 var(--f-display); text-align: center; font-variant-numeric: tabular-nums; padding: 4px 0; }
.amount small { font-size: 18px; color: var(--muted); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chips .chip { font-size: 10.5px; padding: 5px 9px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.field { background: var(--sunk); border-radius: 8px; padding: 6px 8px; display: grid; gap: 1px; font-size: 11px; }
.field .k { font-size: 8.5px; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.keypad span { background: var(--sunk); border-radius: 8px; text-align: center; padding: 7px 0; font: 500 15px/1 var(--f-body); }

.denoms { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 10px; font-size: 11px; font-variant-numeric: tabular-nums; }
.denoms span:nth-child(3n) { text-align: right; }
.stack { height: 12px; border-radius: 4px; overflow: hidden; display: flex; }
.stack i { display: block; height: 100%; }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.c1 { background: var(--accent); } .c2 { background: var(--warn); } .c3 { background: var(--muted); }
.tl { display: grid; gap: 4px; font-size: 11px; }
.tl .row { padding-left: 12px; position: relative; }
.tl .row::before { content: ""; position: absolute; left: 0; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* report */
.report-band { overflow-x: auto; padding-bottom: 6px; }
.pages { display: flex; gap: 24px; width: max-content; padding: 4px; }
.page { width: 620px; min-height: 877px; background: var(--paper); color: var(--paper-ink); box-shadow: 0 1px 3px rgba(0,0,0,.15), 0 10px 30px rgba(0,0,0,.08); padding: 38px 40px 30px; font: 10.5px/1.45 var(--f-body); display: flex; flex-direction: column; gap: 14px; }
.page h4 { font: 700 12px/1.2 var(--f-display); margin: 0; color: var(--paper-ink); display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.5px solid var(--paper-ink); padding-bottom: 3px; }
.page h4 small { font: 400 9px/1 var(--f-mono); color: var(--paper-muted); letter-spacing: .04em; }
.rhead { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid var(--paper-accent); padding-bottom: 10px; gap: 16px; }
.rhead .t { font: 700 22px/1.05 var(--f-display); }
.rhead .s { color: var(--paper-muted); font-size: 10px; }
.rhead .brand { text-align: right; font: 500 9px/1.4 var(--f-mono); color: var(--paper-muted); }
.kpis { display: grid; grid-template-columns: repeat(6, 1fr); border: 1px solid var(--paper-line); }
.kpis div { padding: 7px 8px; border-right: 1px solid var(--paper-line); display: grid; gap: 2px; }
.kpis div:last-child { border-right: 0; background: var(--paper-soft); }
.kpis .k { color: var(--paper-muted); font-size: 7.5px; }
.kpis b { font: 700 12.5px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.recon { background: var(--paper-soft); border-left: 3px solid var(--paper-good); padding: 7px 10px; font-family: var(--f-mono); font-size: 9.5px; }
.recon b { color: var(--paper-good); }
.page table { font-size: 10px; }
.page th { background: transparent; color: var(--paper-muted); font-size: 7.5px; padding: 4px 6px; border-bottom: 1px solid var(--paper-ink); }
.page td { padding: 3.5px 6px; border-bottom: 1px solid var(--paper-line); color: var(--paper-ink); }
.page td.sub { padding-left: 18px; color: var(--paper-muted); }
.page tr.total td { background: var(--paper-soft); font-weight: 600; border-top: 1px solid var(--paper-ink); }
.page .over { color: var(--paper-bad); font-weight: 600; }
.page .ok { color: var(--paper-good); }
.pbar { height: 5px; background: var(--paper-line); width: 64px; display: inline-flex; vertical-align: middle; }
.pbar i { display: block; height: 100%; background: var(--paper-accent); }
.pbar i.o { background: var(--paper-bad); }
.alloc { display: flex; height: 16px; border: 1px solid var(--paper-line); }
.alloc i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 9px; color: var(--paper-muted); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 8px; height: 8px; display: inline-block; }
.a1 { background: #B85C38; } .a2 { background: #0D6A55; } .a3 { background: #4E9C86; } .a4 { background: #8DB8AB; } .a5 { background: #C9D3CE; }
.rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.rfoot { margin-top: auto; display: flex; justify-content: space-between; font: 400 8.5px/1 var(--f-mono); color: var(--paper-muted); border-top: 1px solid var(--paper-line); padding-top: 8px; }

/* roadmap */
.phases { display: grid; gap: 12px; }
.phase { display: grid; grid-template-columns: 120px 1fr; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.phase .when { display: grid; gap: 4px; align-content: start; }
.phase .when b { font: 700 1.5rem/1 var(--f-display); color: var(--accent); }
.phase .what { display: grid; gap: 6px; min-width: 0; }
.phase .done { font-size: .86rem; color: var(--muted); }
.phase .done b { color: var(--fg); }
@media (max-width: 560px) { .phase { grid-template-columns: 1fr; gap: 8px; } }

pre.cmd { background: var(--sunk); border-radius: 10px; padding: 12px 14px; overflow-x: auto; font: 12.5px/1.6 var(--f-mono); margin: 0; }
pre.cmd .c { color: var(--muted); }
.steps { display: grid; gap: 14px; }
.step { display: grid; gap: 8px; }
.qs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; }
.q b { font-family: var(--f-display); }
.q span { color: var(--muted); font-size: .88rem; }
.q em { font-style: normal; font-size: .82rem; color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

.bar-top { display:flex; flex-wrap:wrap; gap:12px 20px; justify-content:space-between; align-items:end; padding-block: 32px 24px; }
.toggle { display:flex; gap:6px; }
.toggle button { font: 500 .82rem var(--f-body); border:1px solid var(--line); background:var(--surface); color:var(--fg); border-radius:999px; padding:5px 12px; cursor:pointer; }
html.single body { padding: 8px; }
html.single .bar-top, html.single figcaption, html.single .phone:not(.show) { display:none; }
html.single .phones { display:block; }
html.single .phone.show { position:fixed; top:8px; left:8px; }
</style>
<script>
// screens.html#home  or  #home-dark  shows one screen only (used for PNG export)
(function () {
  var h = location.hash.slice(1);
  if (!h) return;
  var dark = /-dark$/.test(h), id = h.replace(/-(dark|light)$/, '');
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.classList.add('single');
  document.addEventListener('DOMContentLoaded', function () {
    var el = document.getElementById(id); if (el) el.classList.add('show');
  });
})();
</script>
</head>
<body>
<div class="wrap">
  <div class="bar-top">
    <div style="display:grid; gap:6px">
      <span class="eyebrow">Design · sample data as of 7 Oct 2026</span>
      <h1 style="font-size:2rem">My Fin Tracker screens</h1>
    </div>
    <div class="toggle" role="group" aria-label="Theme">
      <button type="button" onclick="document.documentElement.dataset.theme='light'">Light</button>
      <button type="button" onclick="document.documentElement.dataset.theme='dark'">Dark</button>
      <button type="button" onclick="delete document.documentElement.dataset.theme">System</button>
    </div>
  </div>
  <div class="phones">

    <!-- 1 HOME -->
    <figure class="phone" id="home"><div class="device"><div class="screen">
      <div class="sb"><span>9:41</span><span>4G ▮▮▮</span></div>
      <div class="ab"><div><div class="ttl">October 2026</div><div class="sub">Day 7 of 31</div></div><span class="chip good">✓ Balanced</span></div>
      <div class="body">
        <div class="card hero">
          <span class="k">Left to spend</span>
          <span class="big">৳24,420</span>
          <span style="font-size:11px">≈ ৳1,018 a day for 24 days</span>
          <div class="bar"><i style="width:88.4%"></i><i class="m" style="width:11.6%"></i></div>
          <div class="row sm"><span>Budgeted ৳21,580</span><span>Unplanned ৳2,840</span></div>
        </div>
        <div class="card">
          <span class="k">This month</span>
          <div class="row sm"><span>Carried forward</span><span>10,120</span></div>
          <div class="row sm"><span>Salary</span><span class="pos">+85,000</span></div>
          <div class="row sm"><span>Set aside <span class="mut">savings · goals · DPS</span></span><span class="neg">−37,000</span></div>
          <div class="row sm"><span>Spent</span><span class="neg">−32,700</span></div>
          <div class="row sm"><span>Loan repayment</span><span class="neg">−1,000</span></div>
          <div class="row sm sum"><span>Left to spend</span><span>24,420</span></div>
        </div>
        <div class="split">
          <div class="card"><span class="k">Where it is</span>
            <div class="row sm"><span>Bank</span><span>1,23,970</span></div>
            <div class="row sm"><span>Cash</span><span>7,300</span></div>
